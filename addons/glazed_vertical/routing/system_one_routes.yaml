# The glazed copilot's System One routes (Phase 5 P2), for addons/system_one_router.
# Ten layer-B intents (a fixed tool plan: routing/intent_plans.yaml) and the seven specialists
# (layer A).
# Anything else is the escape option `none_of_these`: the orchestrator reasons about it.
#
# glazed_orchestrator opts in (P5: `routing: {router: system_one, targets: [the seven specialists],
# intents: true}`), which is INERT until the deployment turns routing on (docs/ADDONS.md, "The System
# One router"; the glazed compose does this):
#   AGENT_CORE_ADDONS=...,system_one_router
#   AGENT_CORE_ADDON__SYSTEM_ONE_ROUTER__ROUTES_FILE=glazed_vertical/routing/system_one_routes.yaml
#   AGENT_CORE_ADDON__SYSTEM_ONE_ROUTER__API_KEY_ENV=JEV_API_KEY
#   AGENT_CORE_TURN_ROUTING=true
# AGENT_CORE_TURN_ROUTING=false turns all of it off again; the orchestrator then runs every turn.
#
# BENCHMARK (2026-10-14, evals/routing_questions.yaml, 78 SYNTHETIC questions, jev-1.13.0,
# threshold 0.5, router timeout 800 ms): English descriptions 96% accuracy (15% with routing off),
# 100% of committed routes right, 19% abstention, router p50 113 ms / p95 167 ms. The same routes
# with Spanish descriptions: 94%, 98% committed, p50 105 ms / p95 150 ms; English kept. Thresholds
# 0.5-0.6 are the best plateau (0.4: 95%, one wrong commit at 0.44; 0.7: 94%; 0.9: 85%).
# The descriptions were written knowing the set, so expect less on recorded questions.
# RERUN (2026-10-15, L18, request_action added, 82 questions = 78 + 4 recorded from stress phase5):
# 96% (100% committed, 23% abstention, router p50 80 ms / p95 124 ms); the same three synthetic
# abstentions as before (ds01, to02, sg01); every recorded question passes.
# FAST PATH (S10, Core's AGENT_CORE_FAST_PATH shadow|on): the same call also asks one yes/no question
# per intent above, whether the message asks the copilot to DO something, whether it depends on the
# recent conversation and how complex it is; Core turns two or more detected intents into ONE
# composite of their plans. The questions below are worded for this store.
# BENCHMARK (2026-10-15, P12, 97 questions = 82 + 15 combined, jev, one call per question): router
# p50/p95 84/122 ms with every question asked (single question: 80/124 ms); route accuracy 89%
# (the 15 combined questions are labelled pass and some commit to one of their intents); intent
# sets at threshold 0.5: exact 70%, precision 72%, recall 95%; at 0.7 (the glazed compose value):
# exact 77%, precision 86%, recall 84%, combined questions answered by an exact composite 7/17.
# Misses: day_summary is under-detected inside combined questions ("¿Cómo voy hoy...?" 0.20) and
# stockout_risk/active_issues ride along with expiring_items. Hence shadow first.
# P13 (2026-10-15, after the shadow/on battery): day_summary was never detected at 0.7, not even
# "Dame el resumen del día de hoy". A probe (one Jev call per question of this set, several
# wordings fanned out) gave day_summary's yes/no 0.10-0.92 on its questions with the description
# above, 0.38-0.93 with a question naming "how the store is doing", and 0.84-0.97 with that question
# plus `criteria` (true/false with examples; the highest score on any other question 0.42). So
# day_summary gets its own question and criteria, and three intents that over- or under-fired get
# criteria too. The new `requests_*` question counts the separate things a message asks for: Core
# passes a message asking for more things than the intents it detected (the coverage guard; the
# battery's "¿Cómo voy hoy y qué tengo que pedir?" answered the order and called the day "no
# disponible"). The probe counted 92/97 questions right; the 5 misses are advice or action
# questions, which pass anyway.
# BENCHMARK (2026-10-15, P13, 109 questions = 97 + 4 day_summary + 4 combined + 4 coverage, jev,
# intent threshold 0.7, route threshold 0.7): route accuracy 88%, intent sets exact 94% (P12: 77%),
# precision/recall 95%/99%, day_summary recall 100% (every day question; P12 missed "¿Cómo voy
# hoy...?"), combined questions answered by an exact composite 19/21 (P12: 7/17; the two others
# are an action and a complex question, which pass), coverage questions (cv*) never a composite
# (2 pass:uncovered, 2 pass:complex), every single-intent question counted as one request, router
# p50/p95 94/154 ms. expiring_items got criteria after it rode along with "se me va a acabar"
# (a run without them: exact 91%, combined composites 17/21).
fast_path:
  intent_question: >-
    A bakery store manager sent this message to the store copilot. Among the things it asks, does it
    ask for this? {description}
  action_question: >-
    Does the store manager ask the copilot to CHANGE something - propose, place, prepare or approve
    an order or a transfer, record an event, write down a note, reject a plan - rather than only
    asking for information? Questions such as "what do I have to order?", "give me the summary" or
    "tell me the alerts" only ask for information.
  complexity_question: How much work does answering the store manager's message take?
  complexity_levels:
    - Look up figures or lists the store system already has (sales, orders, alerts, stock,
      deliveries, staff, promotions), even several of them
    - Compare or relate several figures to each other
    - Give advice, a recommendation, a plan, a judgement or explain why something happened
  requests_question: How many separate things does the store manager ask for in this message?
  requests_levels:
    - It asks for one thing
    - It asks for two different things
    - It asks for three different things
    - It asks for four or more different things
instructions: >-
  A bakery store manager sent this message to the store copilot. Which single option is it asking
  for? Choose none_of_these when it asks for advice, a recommendation or a proposal, needs two or
  more options at once, asks to write down a note, rejects something, or is small talk.
escape_description: >-
  Advice, a recommendation, a proposal or a decision on what to do; a mix of several options;
  a note or reminder to write down; a complaint or rejection of a plan; the general overview of the
  store; holidays or weather; greetings and thanks.
routes:
  - label: day_summary
    target: intent:day_summary
    description: Today's or yesterday's numbers for the store - sales, waste and lost sales of one day.
    question: >-
      A bakery store manager sent this message to the store copilot. Among the things it asks, does
      it ask how the store is doing today or on one recent day: the day's summary or results, its
      sales, its waste (merma) or its lost sales?
    criteria:
      true:
        what: >-
          It asks how the day is going or went, a summary of today or yesterday, or a figure of one
          day: sales, waste or sales lost to stockouts.
        examples: ["¿Qué tal vamos?", "Resumen de hoy", "¿Cómo cerramos ayer?", "¿Cuánta merma llevamos?"]
      false:
        what: >-
          It asks only about something else (orders, alerts, stock, deliveries, staff, promotions),
          or about a week, a month or a comparison of periods.
        examples: ["¿Qué tengo que pedir?", "¿Cómo fueron las ventas de la semana?"]
  - label: active_issues
    target: intent:active_issues
    description: The open problems, alerts or urgent operational items of the store right now.
    criteria:
      true: It asks for the store's open problems, alerts, or pending or urgent items in general.
      false: >-
        It asks only about one specific topic - data that does not add up, products running out or
        expiring, orders, deliveries - without asking for the open alerts or problems.
  - label: order_plan
    target: intent:order_plan
    description: What to order or how much to order - the purchase order plan and its deadlines.
    criteria:
      true:
        what: >-
          It asks what or how much to order or buy, the purchase plan, or when an order must be sent,
          or asks to prepare or propose such an order.
        examples: ["¿Cuánto compro de harina?", "¿Qué va en el pedido del jueves?"]
      false: >-
        It asks about something else: products running out, deliveries already on their way,
        expiring products, sales or staff.
  - label: stockout_risk
    target: intent:stockout_risk
    description: Products about to run out, whether stock lasts until a day, risk of stockouts.
    criteria:
      true:
        what: It asks which products may run out, or whether the stock lasts until a day.
        examples: ["¿Me va a alcanzar el pan para el fin de semana?", "¿Qué se me puede terminar?"]
      false: >-
        It asks about products expiring or close to their best-before date, open alerts or what to
        order, and not whether the stock runs out.
  - label: expiring_items
    target: intent:expiring_items
    description: Products about to expire or close to their best-before date.
    criteria:
      true:
        what: It asks which products expire, go bad or reach their best-before date soon.
        examples: ["¿Qué caduca mañana?", "¿Hay pan que se eche a perder pronto?"]
      false:
        what: >-
          It asks only which products will run out, end or be sold out (se acaba, se agota, me quedo
          sin): stock running out is not expiry.
        examples: ["¿Qué producto se me termina primero?"]
  - label: upcoming_deliveries
    target: intent:upcoming_deliveries
    description: Supplier deliveries arriving in the next days - when an order or supplier arrives.
  - label: staffing
    target: intent:staffing
    description: Scheduled staff, employees and shifts for the coming days.
  - label: promo_list
    target: intent:promo_list
    description: The list of promotions or offers that are active, upcoming or ran recently.
  - label: data_integrity
    target: intent:data_integrity
    description: Data problems - records or products that do not add up, money lost unnoticed.
  - label: transfer_options
    target: intent:transfer_options
    description: Which surplus could be sent to another branch - transfer options between stores.
  - label: present_metrics
    target: profile:glazed_present
    description: >-
      Meaning of a store metric or term, KPIs or sales of a week or month compared with another
      period, or the outlook for tomorrow.
  - label: supply_analysis
    target: profile:glazed_supply
    description: >-
      Supplier reliability, expected demand of a product, days of coverage, slow-moving products,
      or an in-depth analysis of one inventory problem.
  - label: strategy_flow
    target: profile:glazed_strategist
    description: >-
      Whether a discount or promotion is a good idea, how many customers will come on a day, and
      whether the staff fits the expected customer flow.
  - label: past_experience
    target: profile:glazed_past
    description: >-
      What happened in the past - how a past promotion went, what was decided before, whether a
      similar event happened already.
  - label: execution_followup
    target: profile:glazed_sentinel
    description: >-
      Whether an approved decision or order was carried out, why something agreed was not done,
      or recording an operational event that happened (a road closure, an outage).
  - label: transfer_proposal
    target: profile:glazed_liaison
    description: Put forward a concrete transfer of products to a named branch for approval.
  - label: integrity_finding
    target: profile:glazed_auditor
    description: Explain one specific data-integrity finding in depth, such as the costliest one.
  # L18 (stress phase5): "Propón el pedido ... y déjalo pendiente de mi aprobación" chose order_plan
  # (a read-only plan) at 0.74, so no proposal was made. A labelled abstention competes better than
  # the broad escape description; `target: pass` runs the orchestrator, which can propose. Probed
  # (jev-1.13.0): that wording -> request_action 0.93 (was order_plan 0.67). Widening the
  # instructions or narrowing order_plan's description instead made "¿Qué tengo que pedir?" and
  # five more questions abstain (90%), so neither changed.
  - label: request_action
    target: pass
    description: >-
      Asks the copilot to do something rather than to tell something - propose, place, prepare,
      approve or leave pending an order, a purchase or another change for the manager's approval.
