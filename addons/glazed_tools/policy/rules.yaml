      - glazed
    reason: >-
      Recording an operational event is an append-only note in the case, not an action on
      the store. The sentinel is the only agent whose toolset holds it.

  - rule_id: glazed-propose-action
    tool_pattern: propose_action
    effect: allow
    subject_roles:
