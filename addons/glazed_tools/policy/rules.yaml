# The policy rules of the glazed vertical's tools (G3, D88), moved from the vertical branch's
# Core/policy/rules.yaml. Same rule ids, patterns, identities and reasons: the audit trail's join from
# a row to the rule that produced it does not break.
#
# THIS FILE NEEDS A DEPLOYMENT THAT MANAGES POLICY FROM FILES (a policy directory): the rules join
# the set Core reconciles at startup, and an addon with policy is refused where there is no such
# directory (otherwise reconciling would delete the rules kept in the database).
#
# ONE GLAZED RULE IS NOT HERE. `glazed-orchestrator-asks-specialists` allows `ask_peer`, a tool of
# Core, and an addon may allow only its own tools. The glazed deployment carries it in its own policy
# directory (text in docs/ADDONS.md "The glazed policy"). Without it the orchestrator's `ask_peer` is
# refused, so the manager gets no specialist.
#
# The rules below are rewritten from the oracle (tests/fixtures/glazed_tools/old_glazed_policy_rules.yaml)
# and tests/unit/test_glazed_policy.py proves they decide the same, tool by tool and identity by identity.
rules:
  # ======================================================================================
  # Glazed store copilot (docs/VERTICAL_GLAZED.md)
  #
  # THREE IDENTITIES, THREE SETS OF ROWS
  #   glazed-manager  channel `glazed`  the orchestrator's turn, started by the backend for a
  #                                     store manager (X-Roles: glazed-manager)
  #   glazed-service  channel `glazed`  scheduled sentinel/auditor turns (backend service)
  #   peer            channel `peer`    a specialist answering the orchestrator's ask_peer
  # Which tools an AGENT holds is its profile's `toolsets`; these rows narrow by IDENTITY
  # (a rule cannot name a profile). The orchestrator holds no data tool (only propose_action and save_manager_note, two writes), and the
  # manager identity matches none of the read rows below, so even a mis-edited profile
  # cannot read data directly. Absent constraint widens, so each row states both.
  # ======================================================================================

  - rule_id: glazed-read-get-snapshot
    tool_pattern: get_snapshot
    effect: allow
    subject_roles:
      - peer
      - glazed-service
    channels:
      - peer
      - glazed
    reason: >-
      The snapshot is one read of everything a specialist usually needs; the backend fixes
      the store and the case and nothing is changed.

  - rule_id: glazed-read-get-briefing
    tool_pattern: get_briefing
    effect: allow
    subject_roles:
      - glazed-manager
    channels:
      - glazed
    reason: >-
      The briefing is the precomputed read-only summary of the case that the orchestrator
      starts every manager question from; nothing is changed.

