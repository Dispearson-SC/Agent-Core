      executed by the agent.

  - rule_id: glazed-save-manager-note
    tool_pattern: save_manager_note
    effect: allow
    subject_roles:
      - glazed-manager
    channels:
      - glazed
    reason: >-
      Saving a manager note is an append-only write of the manager's own words, done by
      backend code. It is the one write the manager turn holds besides proposals, and it
      reads no data and changes no store figure.

  # SCOPE OF THE TWO PEER-TURN DENIES. A rule cannot name a profile and every vertical's
  # answering agent is `peer` on channel `peer`, so these are stated on both dimensions and
  # are not Glazed-only. They add nothing a missing allow would not already refuse (the
  # default is deny); they exist so the model reads the Glazed-specific reason. A vertical
  # that later lets a peer turn propose or ask must grant it with a narrower row and
  # remove the matching deny here.
  - rule_id: glazed-peer-turn-no-propose-action
    tool_pattern: propose_action
    effect: deny
    subject_roles:
      - peer
    channels:
      - peer
    reason: >-
      Only the orchestrator proposes actions. A specialist reports findings to it.

  - rule_id: glazed-peer-turn-no-ask-peer
    tool_pattern: ask_peer
    effect: deny
    subject_roles:
      - peer
    channels:
      - peer
    reason: >-
      Star topology: specialists answer the orchestrator and never ask another agent.

  - rule_id: glazed-deny-everything-else
    tool_pattern: glazed_*
    effect: deny
    reason: >-
      No tool in the Glazed vertical is named glazed_*; any that appears was not reviewed.
