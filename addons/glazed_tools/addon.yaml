# The glazed retail vertical's tools, generated from its backend's own OpenAPI document (Phase 3, G2).
# A consumer of the HTTP tool bridge (docs/ADDONS.md "The HTTP tool bridge"): the tools are the
# /internal/v1 operations the backend marks `x-agent-tool`, patched by overlay.yaml (what OpenAPI cannot
# say: bounds the model gets, arguments it must not see, one operation behind two tools). Eight
# toolsets, one per agent role, each offering exactly the tools that role had before the tools were
# generated. Audit and policy for these tools are declared below (G3); profiles and the channel are G5.
name: glazed_tools
version: 1.0.0
core: ">=0.0,<1"
depends: [http_tool_bridge]
provides:
  toolsets:
    - glazed_orchestrator
    - glazed_present
    - glazed_past
    - glazed_supply
    - glazed_strategist
    - glazed_sentinel
    - glazed_auditor
    - glazed_liaison
  policy: policy/rules.yaml
  # What the audit trail keeps of a call (the glazed entries of the vertical branch's audit map).
  # Everything the model passes is an identifier, a date, a bounded number or a metric name: what
  # the call was about, never personal data; the store, the case and the date are bound by the
  # turn. A tool with no model argument is decided with an empty list: that is a decision, not a gap.
  # `issue_id` and `option_id` ARE the action (the backend copies the action from the stored
  # option), so they are kept by value. Free text the model or the manager wrote is kept by
  # presence only: the backend holds it under its own retention, the append-only trail does not.
  audit:
    allow:
      get_snapshot: []
      get_briefing: []
      get_kpis: [date_from, date_to]
      get_day_summary: [date]
      get_issues: [category, kind, limit]
      explain_metric: [metric]
      get_order_plan: []
      project_inventory: [horizon, sku]
      forecast_demand: [sku, target_date]
      forecast_daily_flow: [target_date]
      get_inventory_status: [limit, sort]
      get_expiring: [days]
      get_deliveries: [days]
      get_staffing: [days]
      get_promos: [days, status]
      get_outlook: [days]
      get_issue_analysis: [issue_id]
      get_supplier_performance: []
      get_history: []
      evaluate_promo: [promo_id]
      recall_experiences: [limit]
      record_event: [date_from, date_to, type]
      propose_action: [issue_id, option_id]
      save_manager_note: [category, date_from, date_to, impact]
      get_transfer_options: [limit, sku]
      propose_transfer: [option_id]
      check_compliance: [decision_id]
      classify_text: [kind]
      audit_promo: [department, discount_pct]
      get_integrity_issues: []
    presence_only:
      propose_action: [rationale]
      record_event: [note]
      recall_experiences: [query]
      classify_text: [text]
      save_manager_note: [text]
      propose_transfer: [rationale]
settings:
  base_url:
    type: str
    default: "http://backend:8080"
    description: The glazed backend (was GLAZED_BACKEND_URL). Its OpenAPI document is read from here once at startup.
  openapi_url:
    type: str
    default: ""
    description: Where the OpenAPI document comes from, an http(s) URL or a file path. Empty means base_url + /openapi.json.
  timeout_seconds: {type: float, default: 10.0, minimum: 0.1}
  connect_timeout_seconds: {type: float, default: 3.0, minimum: 0.1}
  default_row_limit: {type: int, default: 20, minimum: 1}
  session_header:
    type: str
    default: X-Glazed-Case
    description: Carries the case (the asking session's id for a peer turn).
  agent_header: {type: str, default: X-Glazed-Agent}
  tenant_header:
    type: str
    default: X-Glazed-Store
    description: Carries the store (the caller's tenant).
  subject_header: {type: str, default: ""}
  idempotency_header: {type: str, default: Idempotency-Key}
  warning_header: {type: str, default: X-Glazed-Warning}
  peer_session_prefix:
    type: str
    default: "peer~"
    description: A peer turn's session id is peer~<asker session id>~<uuid>; the backend gets the asker's id.
  peer_session_separator: {type: str, default: "~"}
  service_name:
    type: str
    default: Glazed backend
    description: How error messages name the service.
