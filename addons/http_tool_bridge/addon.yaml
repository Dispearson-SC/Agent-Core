# Library addon (marker): the HTTP tool bridge (docs/ADDONS.md, "The HTTP tool bridge"). It provides
# no tool of its own and has no settings of its own. A consumer lists it under `depends`; its toolset
# module declares `build_toolset(settings)` and calls `build_bridge_toolset(settings, manifest=...)`
# (or `openapi=...`) from `agent_core.adapters.driven.tools.http_bridge`. The bridge keys a consumer
# may expose in its OWN `settings:` are the fields of `BridgeSettings` (D84). Nothing here names a
# vertical.
name: http_tool_bridge
version: 1.1.0
core: ">=0.0,<1"
