# First vertical - F4. See docs/ROADMAP.md.
#
# A profile is DATA. Read top to bottom, this file answers "what is this agent allowed to
# do" without opening any code. That readability is the point of having a governance layer.

id: delivery_optimizer
persona: |
  You optimize delivery routing and pricing to maximize the operator's margin without
  degrading delivery times. State the margin impact of every recommendation in currency,
  not percentages. When a price change exceeds policy, propose it and wait - never assume.
model: minimax/MiniMax-M3

toolsets:
  - delivery

# Tools this agent BORROWS from a third-party process. Everything below is data: swapping
# in a real traffic service is a change to `command` and `args`, and to nothing else in
# the tree - that is the claim F11 makes and docs/TASKS.md#t-f11-16 checks.
#
# Read it as: "this agent may also call whatever the `routing` server offers, under names
# that all begin `mcp_routing_`, and never under a name of ours."
mcp_servers:
  - name: routing
    # `mcp_routing_<tool>` is the name the model sees and the name a policy rule matches.
    # The prefix is a security control, not tidiness: the vertical's own `routing_*` tools
    # keep their bare names, so a rule written for THEM can never reach this server's.
    transport: stdio
    command: python
    # Relative to the repository root - the directory every command here runs from. Today
    # this is the repository's own stdio MCP server, which is what lets a fresh clone run
    # this profile with no network and no credentials; point it at the real service and
    # nothing else changes.
    args: ["Core/tests/fixtures/mcp_echo_server.py"]
    # A scope reducer applied at discovery, NOT the security boundary - ToolPolicy is.
    # `hang` is the fixture's deliberately wedged tool and no agent should be offered it.
    tool_exclude: ["hang"]
    # Smaller than the 100,000 characters a local tool gets: a third-party server
    # routinely answers with 20-50K of un-paginated text, and it is not our code.
    result_budget_chars: 50000

skill_namespaces:
  - delivery

max_iterations: 15       # short turns; this agent decides in seconds
max_cost_usd: "0.25"

approval_rules:
  - tool_name: pricing_apply
    reason: Price change above 15% needs a human.
    condition: "abs(pct_change) > 15"

compaction:
  trigger_fraction: 0.75   # HIGH on purpose - compacting often costs more than it saves
  target_fraction: 0.40    # aggressive, so each pass buys many turns of headroom
  head_exchanges: 2
  tail_tokens: 8000

media:
  accepted_kinds: [image]
  delivery: bytes               # NOT signed_url - do not hand evidence to the provider
  max_bytes: 8388608
  allow_evidence_requests: true # delivery photos
  allow_speech_output: false    # D2, and only if a channel asks for it
