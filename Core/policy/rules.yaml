    effect: allow
    subject_roles:
      - peer
      - glazed-service
    channels:
      - peer
      - glazed
    reason: >-
      Recording an operational event is an append-only note in the case, not an action on
      the store. The sentinel is the only agent whose toolset holds it.

  - rule_id: glazed-propose-action
    tool_pattern: propose_action
    effect: allow
    subject_roles:
      - glazed-manager
    channels:
      - glazed
    reason: >-
      A proposal only creates a pending item for the manager to approve or reject; nothing is
      executed by the agent.

  - rule_id: glazed-no-proposals-from-specialists
    tool_pattern: propose_action
    effect: deny
    channels:
      - peer
    reason: >-
      Only the orchestrator proposes actions. A specialist reports findings to it.

  - rule_id: glazed-orchestrator-asks-specialists
    tool_pattern: ask_peer
    effect: allow
    subject_roles:
      - glazed-manager
    channels:
      - glazed
    reason: >-
      The orchestrator delegates to its specialists. The two-sided allowlist and the hop
      limit still decide which peer.

  - rule_id: glazed-specialists-do-not-ask-peers
    tool_pattern: ask_peer
    effect: deny
    channels:
      - peer
    reason: >-
      Star topology: specialists answer the orchestrator and never ask another agent.

  - rule_id: glazed-deny-everything-else
    tool_pattern: glazed_*
    effect: deny
    reason: >-
      No tool in the Glazed vertical is named glazed_*; any that appears was not reviewed.
